# AssetNest — single-host reference stack (development + self-hosted).
#
# Two profiles:
#   infra — PostgreSQL + Redis only, for DEVELOPMENT on the host
#           (local `pnpm dev`, hot reload, Vite dev server):
#             docker compose --env-file .env -f infrastructure/compose/compose.yaml --profile infra up -d
#   app   — the FULL stack (infra + migrate + api + web/Caddy), for self-hosting:
#             docker compose --env-file .env -f infrastructure/compose/compose.yaml --profile app up -d --build
#
# REQUIRED setup:
#   1. cp .env.example .env                       (repo root)
#   2. Edit .env: REPLACE every REPLACE_*/CHANGE_ME value.
#   3. .env must ALSO define the compose-only variables below (they are NOT in
#      .env.example; see infrastructure/compose/README.md):
#        POSTGRES_USER=assetnest
#        POSTGRES_PASSWORD=<url-safe-password>   # [A-Za-z0-9._-]+ recommended
#        POSTGRES_DB=assetnest
#      Optional: POSTGRES_PORT (default 5432), REDIS_PORT (default 6379),
#      WEB_PORT (default 80).
#   4. Everything in .env stays local — it is git-ignored and never copied into images.
#
# Conventions:
#   - Run from the repo root with `--env-file .env` so BOTH interpolation (below)
#     and the services' env_file resolve the same root .env.
#   - env_file paths are ../../.env relative to this file (= repo-root .env).
#   - No secrets are stored in this file; secrets arrive only via .env.
#   - Password note: the api/migrate services assemble DATABASE_URL from
#     POSTGRES_* — keep POSTGRES_PASSWORD URL-safe, or percent-encode it yourself
#     by editing the `environment:` block (never hard-code a real password here).

name: assetnest

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 17 — the system of record. Data persists in the pgdata volume.
  # Published on 127.0.0.1 only (dev convenience: local API connects to localhost);
  # remove the ports block for hardened self-hosting — api reaches it over the
  # internal compose network by service name.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    profiles: ['infra', 'app']
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env (see infrastructure/compose/README.md)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see infrastructure/compose/README.md)}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env (see infrastructure/compose/README.md)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Redis 7 — BullMQ broker + short-lived coordination. appendonly persistence
  # in the redisdata volume. No password in this reference stack: it is only
  # reachable on the internal network and on 127.0.0.1 for dev. For shared or
  # exposed deployments, set a password (requirepass) and REDIS_URL accordingly.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ['infra', 'app']
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # ---------------------------------------------------------------------------
  # One-shot migration job. Uses the SAME image as the api so migrations always
  # run the code that will serve traffic. Runs to completion and exits; the api
  # service waits for it via depends_on: service_completed_successfully.
  # Re-run on every deploy BEFORE rolling the api (see README.md).
  # ---------------------------------------------------------------------------
  migrate:
    image: assetnest/api:local
    build:
      context: ../..
      dockerfile: infrastructure/compose/Dockerfile.api
    profiles: ['app']
    env_file:
      - path: ../../.env
        required: true
    environment:
      # Assembly against the in-compose postgres (see password note in header).
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Migrate does not use Redis today; overridden anyway so the container
      # never sees .env's localhost URL.
      REDIS_URL: redis://redis:6379
      # pnpm (via `pnpm --filter ... migrate`) may want a writable HOME; the
      # node user's home is not guaranteed to exist in node:24-alpine.
      HOME: /tmp
    command: ['pnpm', '--filter', '@assetnest/db', 'migrate']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # API — NestJS on port 3000. Not published on the host: Caddy proxies /api/*
  # and /health/* to it. If you need direct access while debugging, add a
  # "127.0.0.1:3000:3000" ports mapping temporarily.
  #
  # Healthcheck hits /api/v1/health/live (global prefix /api + URI version v1).
  # It must stay trivial (no DB) so orchestrators can restart a wedged process.
  # ---------------------------------------------------------------------------
  api:
    image: assetnest/api:local
    build:
      context: ../..
      dockerfile: infrastructure/compose/Dockerfile.api
    restart: unless-stopped
    profiles: ['app']
    env_file:
      - path: ../../.env
        required: true
    environment:
      # NODE_ENV comes from .env (default development). For real production
      # deployments set NODE_ENV=production and PUBLIC_APP_URL=https://… in
      # .env — @assetnest/config refuses to boot in production mode otherwise.
      API_PORT: 3000
      # Override the localhost DATABASE_URL from .env — inside the network the
      # database is reachable as `postgres`, not `localhost`.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: local
      # Private files live in the private_files named volume, NOT in the image.
      STORAGE_ROOT: /data/private-files
    volumes:
      - private_files:/data/private-files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s

  # ---------------------------------------------------------------------------
  # Worker — drains the transactional outbox (BullMQ) and delivers notifications.
  # Exits 0 with a clear notice when REDIS_URL is unset; otherwise relays.
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: ../..
      dockerfile: infrastructure/compose/Dockerfile.worker
    restart: unless-stopped
    profiles: ['app']
    env_file:
      - path: ../../.env
        required: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: local
      STORAGE_ROOT: /data/private-files
    volumes:
      - private_files:/data/private-files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'pgrep', '-f', 'apps/worker/dist/main.js']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Web — Vite static build served by Caddy, which also reverse-proxies
  # /api/* and /health/* to the api service (see Caddyfile). This is the only
  # service published on all interfaces (port 80; ${WEB_PORT} override).
  # For TLS, replace `:80` in the Caddyfile with your hostname and publish 443 too.
  # ---------------------------------------------------------------------------
  web:
    image: assetnest/web:local
    build:
      context: ../..
      dockerfile: infrastructure/compose/Dockerfile.web
    restart: unless-stopped
    profiles: ['app']
    ports:
      - '${WEB_PORT:-80}:80'
    depends_on:
      api:
        condition: service_healthy
    volumes:
      # Caddy stores certificates (once TLS is configured) and its autosave config.
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      # busybox wget in caddy:2-alpine; checks the SPA responds (not the API).
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  # PostgreSQL data directory. Back up with pg_dump; volume snapshots alone are
  # not a consistent backup. See infrastructure/compose/README.md (Backup).
  pgdata:
  # Redis AOF persistence (appendonly yes).
  redisdata:
  # Local private file storage (STORAGE_ROOT=/data/private-files). Include in
  # every backup together with the database.
  private_files:
  # Caddy certificate store (only populated once a TLS hostname is configured).
  caddy_data:
  # Caddy autosaved configuration.
  caddy_config:
